[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openterms-mcp"
version = "1.0.0"
description = "MCP server for OpenTerms — cryptographic consent receipts + policy engine + provider verification for AI agents."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenTerms", email = "hello@openterms.com" }]
keywords = ["openterms", "mcp", "ai", "agents", "receipts", "policy", "llm", "langchain", "crewai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "mcp>=1.0",
]

[project.scripts]
openterms-mcp = "openterms_mcp_server:run_mcp_server"

[project.urls]
Homepage = "https://openterms.com"
Documentation = "https://openterms.com/docs"
Repository = "https://github.com/jstibal/openterms-mcp"
"Bug Tracker" = "https://github.com/jstibal/openterms-mcp/issues"

[tool.setuptools]
py-modules = ["openterms_mcp_server"]
packages = ["openterms_mcp"]
